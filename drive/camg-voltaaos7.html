<body>

<main>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="path">~/downloads</span>
    </div>

    <div class="term-body">
      <div class="prompt">
        <span class="user">makyneta@drive</span><span>:~$</span>
        <span class="cmd">find .</span>
        <span>-iname</span>
        <input class="filter-input" id="filter" type="text" placeholder="*" autocomplete="off">
      </div>

      <div class="grid" id="grid"></div>
    </div>
  </div>
</main>
