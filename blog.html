  <div id="loader-overlay"></div>
  <style>#loader-overlay{position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .4s}#loader-overlay::after{content:'';width:22px;height:22px;border:2px solid rgba(196,164,80,.15);border-top-color:#c8a450;border-radius:50%;animation:lspin .7s linear infinite}@keyframes lspin{to{transform:rotate(360deg)}}</style>
  <script>var LO=document.getElementById('loader-overlay');if(LO){var R=function(){if(R.d)return;R.d=1;LO.style.opacity='0';setTimeout(function(){LO.remove()},500)};window.addEventListener('load',R);setTimeout(R,5000)}</script>
<div class="noise"></div>
<div id="header"></div>

<main>

  <!-- ══ PAGE HERO ════════════════════════════════════════════════ -->
  <section id="blog-hero">
    <div class="hero-bg-word">BLOGPT_</div>
    <div class="blog-eyebrow"><span>Makyneta — Editorial</span></div>
    <h1 class="blog-title"><em>BLOG</em>_</h1>
  </section>

  <!-- ══ DATELINE ══════════════════════════════════════════════════ -->
  <div class="blog-dateline">
    <span class="dateline-left">Leiria, Portugal · <span id="today-date"></span></span>
    <span class="dateline-right"><span id="article-total">—</span> artigos publicados</span>
  </div>

  <!-- ══ CONTROLS (sticky) ════════════════════════════════════════ -->
  <div id="blog-controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Procurar artigos…" autocomplete="off" />
    </div>
    <div class="filter-tabs" id="filter-tabs"><!-- JS --></div>
  </div>

  <!-- ══ FEATURED ══════════════════════════════════════════════════ -->
  <div id="featured-wrap"><!-- JS --></div>

  <!-- ══ GRID ══════════════════════════════════════════════════════ -->

    <div class="section-header">
      <span class="section-hdr-label">Todos os Artigos</span>
      <span class="article-count"><span id="visible-count">—</span> resultados</span>
    </div>
    <div class="articles-grid" id="articles-grid"></div>
    <div id="no-results"><p>Nenhum artigo encontrado.</p></div>
  </section>

</main>
