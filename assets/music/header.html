  </a>

  <nav class="header-nav">
    <a href="/music/" class="nav-link">Home</a>
    <a href="/music/releases" class="nav-link">Releases</a>
    <a href="/music/tour" class="nav-link">Tour</a>
    <a href="/music/contact" class="nav-link">Contact</a>

    <!-- <div class="dropdown-wrapper">
      <button class="nav-btn">
        Legal
        <i class="fa-solid fa-chevron-down" style="font-size:.4rem;opacity:.5"></i>
      </button>
      <div class="dropdown-menu">

  </nav>

  <button id="mobile-menu-toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <script>
    (function(){
      var path = window.location.pathname;
      document.querySelectorAll('#main-header .nav-link').forEach(function(el){
        if (el.getAttribute('href') === path) el.classList.add('active');
      });
      var btns = document.querySelectorAll('#main-header .nav-btn');
      if (path.match(/^\/(develop|design|photo|video|feedback)/)) {
        if (btns[0]) btns[0].classList.add('active');
      }
      if (path.match(/^\/precos/)) {
        if (btns[1]) btns[1].classList.add('active');
      }
      document.querySelectorAll('#mobile-menu .mm-link').forEach(function(el){
        if (el.getAttribute('href') === path) el.classList.add('active');
      });
    })();
  </script>
</header>

<div id="mobile-menu" aria-hidden="true">
  <div class="mm-window">
    <div class="mm-titlebar">
      <span class="mm-dot r"></span>
      <span class="mm-dot y"></span>
      <span class="mm-dot g"></span>
      <span class="mm-title">makyneta@studio — menu</span>
    </div>
    <div class="mm-body">
      <div class="mm-line"><span class="mm-prompt">$</span><span class="mm-cmd">./makyneta --menu</span></div>
      <ul class="mm-list">
        <li><a href="/music" class="mm-link"><span class="mm-path">~/</span><span class="mm-name">Home</span></a></li>
        <li><a href="/music/releases" class="mm-link"><span class="mm-path">~/</span><span class="mm-name">Releases</span></a></li>
        <li><a href="/music/tour" class="mm-link"><span class="mm-path">~/</span><span class="mm-name">Tour</span></a></li>
        <li><a href="/music/contact" class="mm-link"><span class="mm-path">~/</span><span class="mm-name">Contact</span></a></li>
        <!-- <li class="mm-sep" aria-hidden="true"><span>portfolio</span></li> -->
      </ul>
      <div class="mm-status">
        <span class="mm-prompt">$</span><span class="mm-cmd">exit — ESC close</span><span class="mm-cursor"></span>
      </div>
    </div>
  </div>
</div>
