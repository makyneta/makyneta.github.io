<header id="main-header">
  <a href="/" class="header-logo">
    <img src="/assets/images/ui/header_old.webp" alt="Makyneta" class="header-logo-img">
  </a>

  <nav class="header-nav">
    <a href="/sobre" class="nav-link">Sobre</a>

    <div class="dropdown-wrapper">
      <button class="nav-btn">
        Portfolio
        <i class="fa-solid fa-chevron-down" style="font-size:.4rem;opacity:.5"></i>
      </button>
      <div class="dropdown-menu">
        <a href="/dev"><i class="fa-solid fa-code"></i> Desenvolvimento</a>
        <a href="/design"><i class="fa-solid fa-paint-brush"></i> Design</a>
        <a href="/photo"><i class="fa-solid fa-camera"></i> Fotografia</a>
        <a href="/video"><i class="fa-solid fa-video"></i> Vídeo</a>
        <a href="/feedback"><i class="fa-solid fa-star"></i> Feedback</a>
      </div>
    </div>

    <div class="dropdown-wrapper">
      <button class="nav-btn">
        Preços
        <i class="fa-solid fa-chevron-down" style="font-size:.4rem;opacity:.5"></i>
      </button>
      <div class="dropdown-menu">
        <a href="/precos/dev"><i class="fa-solid fa-code"></i> Desenvolvimento</a>
        <a href="/precos/design"><i class="fa-solid fa-paint-brush"></i> Design</a>
      </div>
    </div>

    <a href="/contacto" class="nav-link">Contacto</a>
  </nav>

  <button id="mobile-menu-toggle-btn" aria-label="Menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <div id="mobile-menu-backdrop"></div>

  <nav id="mobile-sidebar-nav">
    <div class="mobile-brand">MAKYNETA</div>

    <ul id="main-nav-list">
      <li><a href="/" class="mobile-nav-link">Início</a></li>
      <li><a href="/sobre" class="mobile-nav-link">Sobre</a></li>

      <li><span class="mobile-section-label">Portfolio</span></li>
      <li><a href="/dev" class="mobile-sub-link">Desenvolvimento</a></li>
      <li><a href="/design" class="mobile-sub-link">Design</a></li>
      <li><a href="/photo" class="mobile-sub-link">Fotografia</a></li>
      <li><a href="/video" class="mobile-sub-link">Vídeo</a></li>
      <li><a href="/feedback" class="mobile-sub-link">Feedback</a></li>

      <li><span class="mobile-section-label">Preços</span></li>
      <li><a href="/precos/dev" class="mobile-sub-link">Desenvolvimento</a></li>
      <li><a href="/precos/design" class="mobile-sub-link">Design</a></li>

      <li><a href="/contacto" class="mobile-nav-link">Contacto</a></li>
    </ul>
  </nav>

  <script>
    (function(){
      var path = window.location.pathname;
      document.querySelectorAll('#main-header .nav-link').forEach(function(el){
        if (el.getAttribute('href') === path) el.classList.add('active');
      });
      var btns = document.querySelectorAll('#main-header .nav-btn');
      if (path.match(/^\/(develop|design|photo|video|feedback)/)) {
        if (btns[0]) btns[0].classList.add('active');
      }
      if (path.match(/^\/precos/)) {
        if (btns[1]) btns[1].classList.add('active');
      }
      document.querySelectorAll('#mobile-sidebar-nav a').forEach(function(el){
        if (el.getAttribute('href') === path) el.classList.add('active');
      });
    })();
  </script>
</header>
